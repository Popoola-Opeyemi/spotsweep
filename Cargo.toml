[package]
name = "spotlight-dev-exclusions"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Discover development build directories and automatically exclude them from Spotlight"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Popoola-Opeyemi/spotlight-dev-exclusions"
homepage = "https://github.com/Popoola-Opeyemi/spotlight-dev-exclusions"

[[bin]]
name = "spotlight-dev"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
libc = "0.2"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.4"
thiserror = "2.0"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFArray",
  "CFDate",
  "CFRunLoop",
  "CFString",
] }
objc2-core-services = { version = "0.3.2", default-features = false, features = [
  "std",
  "FSEvents",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
